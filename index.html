<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, three views swapped in place (envelope, letter, home). */
:root {
  --wine: #2B0F1B;
  --blush: #F8E1E3;
  --rose: #F2B8C0;
  --muted: #D9A9B2;
  --soft: #E9C6CB;
  --line: #6E3A49;
  --paper: #FBEFEA;
  --ink: #3A1622;
  --ink-muted: #8A5560;
  --seal: #B8405A;
  --display: 'Cormorant Garamond', Georgia, serif;
  --body: Karla, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--wine); color: var(--blush); font-family: var(--body); -webkit-text-size-adjust: 100%; }
main { max-width: 430px; margin: 0 auto; min-height: 100%; display: flex; }
[hidden] { display: none !important; }
h1, p { margin: 0; }
.view { flex: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

.eyebrow { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); text-align: center; }
.btn { width: 100%; height: 54px; border: 0; border-radius: 27px; background: var(--rose); color: var(--wine); font: 500 17px var(--body); cursor: pointer; }
.link { min-height: 44px; padding: 0 20px; border: 0; background: none; color: var(--rose); font: 500 16px var(--body); text-decoration: underline; text-underline-offset: 5px; cursor: pointer; }

/* Envelope */
#v-envelope { justify-content: space-between; gap: 32px; padding: 56px 32px 44px; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 36px; text-align: center; }
.hero svg { animation: float 4s ease-in-out infinite; }
.hero h1 { font: italic 500 50px/1.05 var(--display); text-wrap: balance; }
.hero p { margin-top: 14px; font-size: 17px; line-height: 1.5; color: var(--soft); }
.actions { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.hint { font-size: 13px; color: var(--muted); text-align: center; }
@keyframes float { 50% { transform: translateY(-6px); } }

/* Letter */
#v-letter { padding: 28px 20px 0; }
.paper { flex: 1; align-self: stretch; box-sizing: border-box; background: var(--paper); color: var(--ink); border-radius: 6px; padding: 36px 28px 32px; display: flex; flex-direction: column; gap: 22px; }
.paper-date { align-self: flex-end; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-muted); }
.paper h1 { font: italic 500 40px/1.1 var(--display); }
.letter-body { flex: 1; white-space: pre-wrap; overflow-wrap: break-word; font: 500 20px/1.5 var(--display); }
.caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -0.12em; background: var(--seal); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.signoff { display: flex; flex-direction: column; gap: 4px; font: 500 20px/1.3 var(--display); }
.sig { font: italic 500 32px/1.1 var(--display); color: var(--seal); }
.bar { position: sticky; bottom: 0; align-self: stretch; display: flex; justify-content: center; padding: 16px 0 28px; background: var(--wine); }

/* Home */
#v-home { justify-content: space-between; gap: 28px; padding: 40px 28px 24px; }
.counter { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.days { font: 500 96px/0.9 var(--display); color: var(--rose); font-variant-numeric: lining-nums; }
.days-label { font: italic 500 30px/1.1 var(--display); }
.since { margin-top: 4px; font-size: 14px; line-height: 1.5; color: var(--soft); }
.card { align-self: stretch; box-sizing: border-box; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.line-card { border: 1px solid var(--line); }
.line-card .card-head, .line-who { color: var(--muted); }
.line-text { font: italic 500 22px/1.35 var(--display); overflow-wrap: break-word; }
.line-who { font-size: 13px; }
.word-card { background: var(--paper); color: var(--ink); gap: 10px; }
.word-card .card-head, .word-say, .word-ex-say { color: var(--ink-muted); }
.word-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.word { font: 500 42px/1 var(--display); color: var(--seal); }
.word-say { font-size: 15px; }
.word-meaning { font-size: 16px; line-height: 1.4; }
.word-example { border-top: 1px solid #E3C3C1; padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.word-ex { font: 500 20px/1.3 var(--display); }
.word-ex-say { font-size: 14px; line-height: 1.4; }

#load-error { margin: auto; padding: 32px; text-align: center; line-height: 1.5; }

@media (prefers-reduced-motion: reduce) {
  .hero svg, .caret { animation: none; }
}
</style>
</head>
<body>
<main>
  <p id="load-error" hidden>This page could not load its words. Check content.js for a typo.</p>

  <section id="v-envelope" class="view" hidden>
    <p class="eyebrow" id="start-label"></p>
    <div class="hero">
      <svg width="232" height="160" viewBox="0 0 232 160" aria-hidden="true">
        <rect x="1" y="1" width="230" height="158" rx="8" fill="#FBEFEA"></rect>
        <path d="M1 158 L88 84 M231 158 L144 84" stroke="#E3C3C1" stroke-width="1.5" fill="none"></path>
        <path d="M1 9 L116 100 L231 9" stroke="#D9B2B2" stroke-width="1.5" fill="#F6DDD9" stroke-linejoin="round"></path>
        <circle cx="116" cy="98" r="24" fill="#B8405A"></circle>
        <path d="M116 109 C104 100 105 89 111 89 C114 89 116 92 116 94 C116 92 118 89 121 89 C127 89 128 100 116 109 Z" fill="#FBEFEA"></path>
      </svg>
      <div>
        <h1>For <span id="his-name"></span></h1>
        <p id="welcome"></p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="open" type="button">Open your letter</button>
      <p class="hint">Tap your keychain any time to come back</p>
    </div>
  </section>

  <section id="v-letter" class="view" hidden>
    <article class="paper">
      <p class="paper-date" id="paper-date"></p>
      <h1 id="greeting"></h1>
      <p class="letter-body" id="letter-body"><span class="caret" id="caret" aria-hidden="true"></span></p>
      <div class="signoff" id="signoff" hidden>
        <p id="signoff-text"></p>
        <p class="sig" id="her-name"></p>
      </div>
    </article>
    <div class="bar">
      <button class="link" id="skip" type="button">Show the whole letter</button>
      <button class="link" id="more" type="button" hidden>There is more for you</button>
    </div>
  </section>

  <section id="v-home" class="view" hidden>
    <p class="eyebrow" id="names"></p>
    <div class="counter">
      <p class="days" id="days"></p>
      <p class="days-label">days of us</p>
      <p class="since"><span id="breakdown"></span><br>since <span id="since-date"></span></p>
    </div>
    <div class="card line-card" id="line-card">
      <div class="card-head"><span>Today's line</span><span id="today"></span></div>
      <p class="line-text" id="line-text"></p>
      <p class="line-who" id="line-who"></p>
    </div>
    <div class="card word-card" id="word-card">
      <div class="card-head"><span>Mongolian word of the day</span></div>
      <div class="word-row"><p class="word" id="word" lang="mn"></p><p class="word-say" id="word-say"></p></div>
      <p class="word-meaning" id="word-meaning"></p>
      <div class="word-example" id="word-example">
        <p class="word-ex" id="word-ex" lang="mn"></p>
        <p class="word-ex-say" id="word-ex-say"></p>
      </div>
    </div>
    <button class="link" id="reread" type="button">Read your letter again</button>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var views = ['v-envelope', 'v-letter', 'v-home'];
  var SEEN_KEY = 'letter-opened';

  function show(id) {
    views.forEach(function (v) { $(v).hidden = v !== id; });
    window.scrollTo(0, 0);
  }
  function hasSeen() { try { return localStorage.getItem(SEEN_KEY) === '1'; } catch (e) { return false; } }
  function markSeen() { try { localStorage.setItem(SEEN_KEY, '1'); } catch (e) {} }

  function init(C) {
    var s = C.startDate;
    var start = new Date(s[0], s[1] - 1, s[2]);
    var now = new Date();
    var dayNumber = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(s[0], s[1] - 1, s[2])) / 86400000);
    function todays(list) { var n = list.length; return list[((dayNumber % n) + n) % n]; }

    // Names and dates
    document.title = 'For ' + C.hisName;
    $('his-name').textContent = C.hisName;
    $('her-name').textContent = C.yourName;
    $('names').textContent = C.hisName + ' & ' + C.yourName;
    $('welcome').textContent = C.welcome;
    $('greeting').textContent = C.greeting;
    $('signoff-text').textContent = C.signoff;
    $('start-label').textContent = start.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
    $('since-date').textContent = $('start-label').textContent;
    $('paper-date').textContent = start.toLocaleDateString('en-AU', { day: 'numeric', month: 'long' });
    $('today').textContent = now.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });

    // Counter
    var y = now.getFullYear() - s[0];
    var m = now.getMonth() - (s[1] - 1);
    var d = now.getDate() - s[2];
    if (d < 0) { m -= 1; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if (m < 0) { y -= 1; m += 12; }
    var parts = [];
    if (y > 0) parts.push(y + (y === 1 ? ' year' : ' years'));
    if (m > 0) parts.push(m + (m === 1 ? ' month' : ' months'));
    parts.push(d + (d === 1 ? ' day' : ' days'));
    $('days').textContent = dayNumber;
    $('breakdown').textContent = parts.join(', ');

    // Today's line
    var lines = C.lines || [];
    if (lines.length) {
      var line = todays(lines);
      $('line-text').textContent = line.line;
      $('line-who').textContent = line.who || '';
      $('line-who').hidden = !line.who;
    } else {
      $('line-card').hidden = true;
    }

    // Word of the day
    var words = C.words || [];
    if (words.length) {
      var w = todays(words);
      $('word').textContent = w.word;
      $('word-say').textContent = w.say;
      $('word-meaning').textContent = w.meaning;
      $('word-ex').textContent = w.example || '';
      $('word-ex-say').textContent = [w.exampleSay, w.exampleMeaning].filter(Boolean).join(' ');
      $('word-example').hidden = !w.example;
    } else {
      $('word-card').hidden = true;
    }

    // Letter, typed at reading pace
    var text = (C.letter || []).join('\n\n');
    var speed = C.typingSpeed || 45;
    var caret = $('caret');
    var node = document.createTextNode('');
    $('letter-body').insertBefore(node, caret);
    var pos = 0;
    var timer = null;
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function finish() {
      clearTimeout(timer);
      pos = text.length;
      node.data = text;
      caret.hidden = true;
      $('signoff').hidden = false;
      $('skip').hidden = true;
      $('more').hidden = false;
      markSeen();
    }
    function tick() {
      if (pos >= text.length) { finish(); return; }
      var ch = text.charAt(pos);
      pos += 1;
      node.data = text.slice(0, pos);
      caret.scrollIntoView({ block: 'nearest' });
      var delay = speed;
      if (ch === '.' || ch === '!' || ch === '?') delay = speed * 9;
      else if (ch === ',' || ch === ';') delay = speed * 4;
      else if (ch === '\n') delay = speed * 6;
      timer = setTimeout(tick, delay);
    }
    function openLetter(instant) {
      show('v-letter');
      if (instant || calm) { finish(); return; }
      pos = 0;
      node.data = '';
      caret.hidden = false;
      $('signoff').hidden = true;
      $('skip').hidden = false;
      $('more').hidden = true;
      timer = setTimeout(tick, 700);
    }

    $('open').addEventListener('click', function () { openLetter(false); });
    $('skip').addEventListener('click', finish);
    $('more').addEventListener('click', function () { show('v-home'); });
    $('reread').addEventListener('click', function () { openLetter(true); });

    show(hasSeen() ? 'v-home' : 'v-envelope');
  }

  // content.js is loaded with a fresh address each time so edits show up straight away.
  var tag = document.createElement('script');
  tag.src = 'content.js?v=' + Date.now();
  tag.onload = function () {
    if (window.CONTENT) { init(window.CONTENT); } else { $('load-error').hidden = false; }
  };
  tag.onerror = function () { $('load-error').hidden = false; };
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
